<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Milk Pink - Checkout</title>
<!-- Google Fonts: Poppins & Open Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed-variant": "#484a00",
            "surface-container-high": "#efe6e8",
            "error": "#ba1a1a",
            "primary": "#8c005a",
            "inverse-primary": "#ffafd1",
            "surface-container-highest": "#e9e0e3",
            "primary-fixed": "#ffd8e6",
            "surface-container": "#f5ebee",
            "secondary-container": "#f2dedb",
            "surface-container-low": "#fbf1f4",
            "inverse-on-surface": "#f8eef1",
            "on-primary-fixed-variant": "#8b0059",
            "outline": "#8b707a",
            "on-secondary-container": "#6f615f",
            "on-primary-fixed": "#3d0025",
            "on-error-container": "#93000a",
            "surface-bright": "#fff8f9",
            "on-error": "#ffffff",
            "surface-variant": "#e9e0e3",
            "background": "#fff8f9",
            "on-primary-container": "#ffccdf",
            "secondary-fixed-dim": "#d5c2c0",
            "surface-dim": "#e1d8da",
            "outline-variant": "#debec9",
            "surface": "#fff8f9",
            "on-secondary": "#ffffff",
            "tertiary-fixed": "#e7eb0f",
            "on-tertiary-fixed": "#1c1d00",
            "on-secondary-fixed-variant": "#514442",
            "on-background": "#1f1a1c",
            "on-secondary-fixed": "#231918",
            "surface-tint": "#b60076",
            "secondary": "#695b59",
            "tertiary-fixed-dim": "#cace00",
            "primary-container": "#b70077",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#dee200",
            "on-surface-variant": "#57404a",
            "primary-fixed-dim": "#ffafd1",
            "secondary-fixed": "#f2dedb",
            "on-primary": "#ffffff",
            "tertiary": "#494a00",
            "inverse-surface": "#342f31",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1f1a1c",
            "error-container": "#ffdad6",
            "tertiary-container": "#616300"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "gutter-mobile": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",
            "space-2xs": "0.25rem",
            "margin-desktop": "2rem",
            "space-xs": "0.5rem",
            "gutter-desktop": "1.5rem",
            "space-sm": "0.75rem",
            "space-md": "1rem",
            "margin-mobile": "1rem",
            "space-2xl": "3rem"
          },
          "fontFamily": {
            "body-lg": ["Open Sans"],
            "headline-md": ["Poppins"],
            "label-sm": ["Poppins"],
            "body-md": ["Open Sans"],
            "label-md": ["Poppins"],
            "body-sm": ["Open Sans"],
            "headline-lg": ["Poppins"],
            "display-lg-mobile": ["Poppins"],
            "display-lg": ["Poppins"],
            "headline-sm": ["Poppins"],
            "title-md": ["Poppins"],
            "label-lg": ["Poppins"]
          },
          "fontSize": {
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-md": ["20px", { "lineHeight": "26px", "fontWeight": "600" }],
            "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "700" }],
            "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
            "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
            "headline-lg": ["26px", { "lineHeight": "32px", "fontWeight": "700" }],
            "display-lg-mobile": ["30px", { "lineHeight": "36px", "fontWeight": "700" }],
            "display-lg": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
            "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
            "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "600" }],
            "label-lg": ["14px", { "lineHeight": "18px", "fontWeight": "600" }]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header Linear/Task Focused (No BottomNavBar, no border lines per design system) -->
<header class="fixed top-0 left-0 w-full z-40 bg-surface shadow-sm h-16 flex items-center justify-between px-gutter-mobile max-w-md mx-auto right-0">
<button aria-label="Voltar" class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container transition-colors duration-150 active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm text-on-surface tracking-tight">Dados para Entrega</h1>
<div class="w-10 h-10 flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
</div>
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 max-w-md mx-auto w-full pt-20 pb-28 px-gutter-mobile">
<!-- Subtle Step Indicator -->
<section class="mb-space-lg">
<div class="flex items-center justify-between mb-space-xs">
<span class="text-label-md font-label-md text-primary-container">Passo 1 de 3</span>
<span class="text-label-sm font-label-sm text-secondary">Identificação &amp; Endereço</span>
</div>
<!-- Progress Bar Track -->
<div class="w-full h-1.5 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-1/3 transition-all duration-300"></div>
</div>
</section>
<form class="space-y-space-xl" id="checkout-form" onsubmit="event.preventDefault();">
<!-- Seção: Quem vai receber? -->
<section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm border border-outline-variant/30">
<div class="flex items-center gap-space-xs mb-space-md">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="person">person</span>
</div>
<h2 class="text-title-md font-title-md text-on-surface">Quem vai receber?</h2>
</div>
<div class="space-y-space-md">
<!-- Nome Completo -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="full-name">Nome Completo</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="person">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="full-name" placeholder="Seu nome completo" type="text" value="Ana Clara Souza"/>
</div>
</div>
<!-- WhatsApp -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="whatsapp">WhatsApp</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="call">call</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="whatsapp" placeholder="(00) 00000-0000" type="tel" value="(11) 99883-8154"/>
</div>
</div>
<!-- E-mail -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="email">E-mail</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="email" placeholder="seu.email@exemplo.com" type="email" value="anaclara@email.com"/>
</div>
</div>
</div>
</section>
<!-- Seção: Onde entregar? -->
<section class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm border border-outline-variant/30">
<div class="flex items-center gap-space-xs mb-space-md">
<div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[18px]" data-icon="location_on">location_on</span>
</div>
<h2 class="text-title-md font-title-md text-on-surface">Onde entregar?</h2>
</div>
<!-- Banner Especial: Usar localização atual -->
<div class="mb-space-md">
<button class="w-full flex items-center justify-between p-space-sm bg-[#D7F7E1] hover:bg-[#c6f0d3] active:scale-[0.98] transition-all rounded-xl border border-emerald-200/60 text-left" type="button">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-emerald-800 text-[22px]" data-icon="my_location">my_location</span>
<div>
<p class="font-label-md text-label-md text-emerald-950">Usar minha localização atual</p>
<p class="font-body-sm text-body-sm text-emerald-800">Preenchimento com base no GPS</p>
</div>
</div>
<span class="bg-emerald-100 text-emerald-900 border border-emerald-300/60 text-label-sm font-label-sm px-2 py-0.5 rounded-full whitespace-nowrap">
              Opcional / Rápido
            </span>
</button>
</div>
<div class="space-y-space-md">
<!-- CEP com busca automática -->
<div>
<div class="flex items-center justify-between mb-space-2xs">
<label class="block text-label-md font-label-md text-on-surface-variant" for="cep">CEP</label>
<button class="text-label-sm font-label-sm text-primary hover:underline" type="button">Não sei meu CEP</button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="travel_explore">travel_explore</span>
<input class="w-full pl-11 pr-24 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="cep" placeholder="00000-000" type="text" value="01310-100"/>
<div class="absolute right-3 flex items-center gap-1 text-emerald-700 bg-[#D7F7E1] px-2 py-1 rounded-lg text-label-sm font-label-sm">
<span class="material-symbols-outlined text-[16px]" data-icon="check_circle">check_circle</span>
<span>Válido</span>
</div>
</div>
</div>
<!-- Endereço e Número -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="address">Endereço e Número</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="home">home</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="address" placeholder="Nome da rua e número" type="text" value="Rua das Flores, 142"/>
</div>
</div>
<!-- Complemento / Apto -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="complement">Complemento / Apto</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="apartment">apartment</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="complement" placeholder="Ex: Bloco 3, Apto 12" type="text" value="Apto 42B"/>
</div>
</div>
<!-- Ponto de Referência -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-space-2xs" for="reference">Ponto de Referência</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline pointer-events-none text-[20px]" data-icon="near_me">near_me</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="reference" placeholder="Ex: Em frente à padaria" type="text" value="Próximo à praça"/>
</div>
</div>
</div>
</section>
<!-- Aviso amigável de privacidade -->
<section class="flex items-start gap-space-xs bg-surface-container-low/60 rounded-xl p-space-sm border border-outline-variant/20">
<span class="material-symbols-outlined text-outline text-[18px] mt-0.5 shrink-0" data-icon="lock">lock</span>
<p class="text-body-sm font-body-sm text-on-surface-variant leading-relaxed">
          Seus dados não serão armazenados e servem apenas para montagem da mensagem de entrega.
        </p>
</section>
</form>
</main>
<!-- Botão Fixo Inferior -->
<footer class="fixed bottom-0 left-0 w-full z-40 bg-surface shadow-lg max-w-md mx-auto right-0 p-gutter-mobile">
<button class="w-full h-[52px] bg-primary-container hover:opacity-95 text-on-primary font-headline-sm text-headline-sm rounded-full flex items-center justify-center gap-space-xs active:scale-[0.97] transition-all shadow-md" type="button">
<span>Avançar para Revisão</span>
<span class="material-symbols-outlined text-[22px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</body></html>

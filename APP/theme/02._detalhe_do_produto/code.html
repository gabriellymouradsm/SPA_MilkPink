<script>
    // Calculations & Dynamic Interactions
    const BASE_PRICE = 23.90;
    let sizeAdditional = 4.00; // 500ml default selected
    let quantity = 1;
    let isFavorite = false;

    const sizeRadios = document.querySelectorAll('input[name="product_size"]');
    const sizeLabels = document.querySelectorAll('.size-option');
    const addCheckboxes = document.querySelectorAll('input[type="checkbox"][data-price]');
    const totalPriceEl = document.getElementById('total-price');
    const qtyDisplay = document.getElementById('qty-display');
    const qtyDecreaseBtn = document.getElementById('qty-decrease');
    const qtyIncreaseBtn = document.getElementById('qty-increase');
    const favBtn = document.getElementById('favorite-btn');
    const favIcon = document.getElementById('fav-icon');

    function calculateTotal() {
      let extras = 0;
      addCheckboxes.forEach(cb => {
        if (cb.checked) {
          extras += parseFloat(cb.dataset.price);
        }
      });
      const singleUnit = BASE_PRICE + sizeAdditional + extras;
      const finalTotal = singleUnit * quantity;
      totalPriceEl.textContent = `R$ ${finalTotal.toFixed(2).replace('.', ',')}`;
    }

    // Size Selection Handler
    sizeRadios.forEach((radio, index) => {
      radio.addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === '300') sizeAdditional = 0.00;
        if (val === '500') sizeAdditional = 4.00;
        if (val === '700') sizeAdditional = 7.00;

        sizeLabels.forEach((label, idx) => {
          if (idx === index) {
            label.className = "size-option relative flex flex-col items-center justify-center p-3 rounded-xl border-2 border-primary bg-secondary-container/60 cursor-pointer transition-all text-center select-none";
            const title = label.querySelector('span:first-of-type');
            if (title) title.className = "font-title-md text-title-md font-bold text-primary";
          } else {
            label.className = "size-option relative flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant/50 bg-surface-container-lowest cursor-pointer transition-all hover:bg-surface-container-low text-center select-none";
            const title = label.querySelector('span:first-of-type');
            if (title) title.className = "font-title-md text-title-md font-bold text-on-surface";
          }
        });

        calculateTotal();
      });
    });

    // Checkboxes Listeners
    addCheckboxes.forEach(cb => {
      cb.addEventListener('change', calculateTotal);
    });

    // Quantity Handlers
    qtyIncreaseBtn.addEventListener('click', () => {
      quantity += 1;
      qtyDisplay.textContent = quantity;
      calculateTotal();
    });

    qtyDecreaseBtn.addEventListener('click', () => {
      if (quantity > 1) {
        quantity -= 1;
        qtyDisplay.textContent = quantity;
        calculateTotal();
      }
    });

    // Favorite Toggle
    favBtn.addEventListener('click', () => {
      isFavorite = !isFavorite;
      if (isFavorite) {
        favIcon.style.fontVariationSettings = "'FILL' 1";
        favIcon.classList.add('text-primary');
      } else {
        favIcon.style.fontVariationSettings = "'FILL' 0";
      }
    });

    // Initial calculation check
    calculateTotal();
  </script>
